server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:grocery}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none        # schema is owned by Flyway migrations
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  expiry-alert-days: 7
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}   # >= 32 chars; override in production
    expiry-minutes: 720
  owner:
    username: ${APP_OWNER_USERNAME:owner}
    password: ${APP_OWNER_PASSWORD:ChangeMe@123}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
