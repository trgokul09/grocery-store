# One-command stack:  docker compose up --build   ->  http://localhost:8081
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: grocery
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grocery_pw}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/grocery
      DB_USER: grocery
      DB_PASSWORD: ${DB_PASSWORD:-grocery_pw}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-secret-value}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-ChangeMe@123}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      CORS_ORIGINS: http://localhost:8081

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  pgdata:
